# Mantém a API do Render (plano gratuito) acordada: o Render hiberna após ~15 min sem acessos.
# Gratuito em repositório público. O GitHub pode atrasar execuções agendadas em alguns minutos
# e DESATIVA agendamentos após 60 dias sem atividade no repositório (basta um commit ou reativar em Actions).
name: keep-alive

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Acordar API
        env:
          API_URL: ${{ vars.API_URL || 'https://conecta-barra-api-k4xh.onrender.com' }}
        run: |
          for i in 1 2 3; do
            if curl -fsS --max-time 70 "$API_URL/api/health"; then echo; exit 0; fi
            echo "tentativa $i falhou; aguardando"; sleep 20
          done
          exit 1
